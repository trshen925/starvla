run_id: qwen35_08b_oft_droid_c42_smoke
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_droid
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    # Override with a local snapshot if the cluster is offline.
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 8
    state_dim: 8
    action_horizon: 15

datasets:
  vla_data:
    dataset_py: raw_droid_c42
    root: /mnt/pfs/data/fenghaoran/droid/decompressed/1.0.1
    clip_mapping: /mnt/pfs/users/shentingrui/code/robo/video_gen/gen2act/gen2act/metadata/c42_c39_to_raw_droid_mapping.json
    action_horizon: 15
    views: [front, wrist]
    include_state: true
    per_device_batch_size: 1
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 1
    pin_memory: true
    parquet_cache_size: 8
    obs_image_size: [224, 224]
    # Set to null for all 565,946 C42 event-balanced train windows.
    max_samples: 128

trainer:
  max_train_steps: 20
  num_warmup_steps: 2
  save_interval: 20
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  # First verify the data/action head with a frozen VLM.  Remove this after smoke succeeds.
  freeze_modules: qwen_vl_interface
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
