# Four-GPU smoke for the C42/C39 high-quality DROID clip index, using native
# OXE-DROID EEF-delta action semantics.  This is intentionally a small prefix
# of the mapped index; the full recipe uses 349880 steps for 20 epochs.
run_id: diffusion_policy_oxe_droid_c42_mapping_smoke
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: trshen925-peking-university
wandb_project: starvla_droid
is_debug: false

framework:
  name: DiffusionPolicy
  action_encoding: eef_delta
  action_dim: 7
  state_dim: 10
  horizon: 16
  n_obs_steps: 1
  n_action_steps: 8
  image_size: [224, 224]
  image_keys: [exterior_image_1, exterior_image_2, wrist_image]
  pretrained_backbone: true
  num_inference_steps: 10
  obs_as_global_cond: true
  diffusion_step_embed_dim: 128
  down_dims: [128, 256, 512]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  num_train_timesteps: 100

datasets:
  vla_data:
    dataset_py: raw_droid_oxe_dp
    data_mix: raw_droid_oxe_dp_c42_mapping
    root: /mnt/pfs/data/fenghaoran/droid/decompressed/1.0.1
    clip_mapping: /mnt/pfs/users/shentingrui/code/robo/video_gen/gen2act/gen2act/metadata/c42_c39_to_raw_droid_mapping.json
    action_horizon: 16
    per_device_batch_size: 8
    num_workers: 2
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true
    parquet_cache_size: 8
    decoded_frame_cache_mb: 128
    decoded_frame_cache_block_frames: 32
    video_reader_cache: 4
    ffmpeg_threads: 1
    video_reader_retries: 3
    video_reader_retry_delay: 0.25
    episode_local_sampler: true
    shuffle: true
    obs_image_size: [224, 224]
    max_samples: 1024

trainer:
  max_train_steps: 40
  num_warmup_steps: 4
  save_interval: 40
  eval_interval: 1000000
  learning_rate:
    base: 1.0e-4
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-5
  freeze_modules: ""
  max_grad_norm: 1.0
  weight_decay: 1.0e-6
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-06
  save_format: pt
