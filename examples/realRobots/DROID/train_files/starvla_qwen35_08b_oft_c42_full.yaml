run_id: qwen35_08b_oft_droid_c42_full_wandb
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: trshen925-peking-university
wandb_project: starvla_droid
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: Qwen/Qwen3.5-0.8B
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: MLP
    action_dim: 8
    state_dim: 8
    action_horizon: 15

datasets:
  vla_data:
    dataset_py: raw_droid_c42
    data_mix: droid_c42_raw_full
    root: /mnt/pfs/data/fenghaoran/droid/decompressed/1.0.1
    clip_mapping: /mnt/pfs/users/shentingrui/code/robo/video_gen/gen2act/gen2act/metadata/c42_c39_to_raw_droid_mapping.json
    action_horizon: 15
    views: [front, wrist]
    include_state: true
    per_device_batch_size: 1
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 1
    pin_memory: true
    parquet_cache_size: 8
    obs_image_size: [224, 224]
    # null uses all 565,946 C42 event-balanced train windows.
    max_samples: null

trainer:
  # One pass over 565,946 C42 train windows with global batch size 4.
  max_train_steps: 141486
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 1000000
  pretrained_checkpoint: results/Checkpoints/qwen35_08b_oft_droid_c42_smoke/final_model/pytorch_model.pt
  learning_rate:
    base: 2.0e-6
    qwen_vl_interface: 2.0e-6
    action_model: 5.0e-5
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 2.0e-7
  freeze_modules: ""
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: pt
